name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for file in index.js client.js lib/*.js relay/relay.mjs; do node --check "$file"; done
      - name: Smoke test
        run: node test/smoke.mjs
